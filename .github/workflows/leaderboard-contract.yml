name: Leaderboard verification

on:
  pull_request:
    paths:
      - ".github/workflows/leaderboard-contract.yml"
      - "package-lock.json"
      - "package.json"
      - "playwright*.ts"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vite*.ts"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiles-game-leaderboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tiles-game
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify CI trigger contract
        run: npm run test:ci-workflow

      - name: Run production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
